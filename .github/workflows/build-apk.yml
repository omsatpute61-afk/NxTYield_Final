name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/NxTYield_v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NxTYield-Android-APK
          path: release-output/NxTYield_v1.0.0.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "NxTYield v1.0.0 (Android APK)"
          body: |
            ### 🚜 NxTYield Smart Agriculture App - Official Android APK
            
            Download the standalone Android APK directly to your phone.
            
            **Features in this build:**
            - Real-time IoT soil moisture, humidity, and temperature monitoring
            - AI irrigation recommendations and relay switching
            - Weather forecasting & farm crop telemetry
            
            **Installation:**
            1. Download `NxTYield_v1.0.0.apk` below.
            2. Tap the downloaded file to install on your Android device.
          files: release-output/NxTYield_v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
