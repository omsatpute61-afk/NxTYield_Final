name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Copy APK to release folder
        run: |
          mkdir -p release-output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} release-output/NxTYield.apk \;
          ls -la release-output

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NxTYield-APK
          path: release-output/NxTYield.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (v1.0.0)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "NxTYield v1.0.0 (Android APK)"
          body: "Direct download link for NxTYield Android App APK."
          files: release-output/NxTYield.apk
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
